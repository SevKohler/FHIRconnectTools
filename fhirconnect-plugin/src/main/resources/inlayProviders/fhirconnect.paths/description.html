Shows, after each <code>fhir:</code> and <code>openehr:</code> value of a FHIRconnect mapping method, the
fully resolved path (following <code>followedBy</code>, <code>$resource</code>, <code>$archetype</code>,
<code>$fhirRoot</code>, <code>$openehrRoot</code>, <code>^</code> and <code>../</code>) together with the
template node's label, RM type and occurrences or the FHIR element's type and cardinality.
